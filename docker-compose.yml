services:
  api:
    build: ./api
    container_name: web-ide-api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      - WORKSPACES_ROOT=/data/workspaces
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:8080
    volumes:
      - workspace_data:/data/workspaces
      - ./.docker/npm-global:/opt/npm-global
    networks:
      - ide_net
    restart: unless-stopped

  web:
    build: ./web
    container_name: web-ide-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - ide_net
    restart: unless-stopped

networks:
  ide_net:
    driver: bridge

volumes:
  workspace_data:
